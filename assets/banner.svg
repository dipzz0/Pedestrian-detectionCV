<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f09" />
      <stop offset="50%" stop-color="#0d0a06" />
      <stop offset="100%" stop-color="#070503" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
    </pattern>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="1200" height="360" fill="url(#bg)" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <circle cx="920" cy="180" r="230" fill="url(#glow)" />
  <rect x="1" y="1" width="1198" height="358" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Left Column -->
  <g transform="translate(64, 0)">
    <g transform="translate(0, 52)">
      <rect width="258" height="26" rx="13" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#f59e0b" />
      <text x="26" y="17" class="font-mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">YOLOV8 ARCHITECTURE • CLASS 0</text>
    </g>

    <g transform="translate(0, 126)">
      <text x="0" y="0" class="font-sans" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        Pedestrian-DetectionCV
      </text>
    </g>

    <g transform="translate(0, 162)">
      <text x="0" y="0" class="font-sans" font-size="16.5" font-weight="400" fill="#94a3b8">
        Real-time pedestrian tracking and localization using Ultralytics YOLOv8.
      </text>
      <text x="0" y="24" class="font-sans" font-size="14" font-weight="400" fill="#64748b">
        Filters specifically for human class instances with high-speed bounding box inference.
      </text>
    </g>

    <!-- Specs Pills -->
    <g transform="translate(0, 246)">
      <g transform="translate(0, 0)">
        <rect width="118" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="59" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Google Colab</text>
      </g>
      <g transform="translate(126, 0)">
        <rect width="128" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="64" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">YOLOv8 Nano</text>
      </g>
      <g transform="translate(262, 0)">
        <rect width="118" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="59" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Person Filter</text>
      </g>
      <g transform="translate(388, 0)">
        <rect width="128" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="64" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">PIL + OpenCV</text>
      </g>
    </g>

    <g transform="translate(0, 308)">
      <text x="0" y="0" class="font-mono" font-size="11" fill="#475569">Targeted COCO index 0 • Sub-15ms inference • Surveillance &amp; robotics ready</text>
    </g>
  </g>

  <!-- Right Column: Minimalist Tracking Card -->
  <g transform="translate(680, 42)">
    <rect width="456" height="276" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 446 0 C 451.523 0 456 4.477 456 10 L 456 34 L 0 34 Z" fill="#0d131f" />
    <line x1="0" y1="34" x2="456" y2="34" stroke="#1e293b" stroke-width="1" />
    
    <circle cx="18" cy="17" r="4.5" fill="#ef4444" fill-opacity="0.75" />
    <circle cx="32" cy="17" r="4.5" fill="#f59e0b" fill-opacity="0.75" />
    <circle cx="46" cy="17" r="4.5" fill="#10b981" fill-opacity="0.75" />
    
    <text x="228" y="21" class="font-mono" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">yolov8.pedestrian // class_0_tracker</text>

    <g transform="translate(24, 52)">
      <!-- Left Visual: Pedestrian Bounding Box Graphic -->
      <g transform="translate(0, 0)">
        <rect width="210" height="186" rx="8" fill="#080c14" stroke="#172033" stroke-width="1" />
        
        <!-- Pedestrian Silhouette / Frame -->
        <rect x="58" y="24" width="94" height="136" rx="3" fill="none" stroke="#f59e0b" stroke-width="2" />
        <rect x="58" y="10" width="76" height="14" rx="2" fill="#f59e0b" />
        <text x="62" y="20" class="font-mono" font-size="8.5" font-weight="700" fill="#0c0804">PERSON 94%</text>

        <!-- Minimal Pedestrian Vector Inside Frame -->
        <circle cx="105" cy="46" r="12" fill="none" stroke="#cbd5e1" stroke-width="2" />
        <!-- Torso -->
        <line x1="105" y1="58" x2="105" y2="106" stroke="#cbd5e1" stroke-width="2.5" />
        <!-- Arms -->
        <line x1="84" y1="74" x2="126" y2="74" stroke="#cbd5e1" stroke-width="2" />
        <!-- Legs -->
        <line x1="105" y1="106" x2="90" y2="146" stroke="#cbd5e1" stroke-width="2.2" />
        <line x1="105" y1="106" x2="120" y2="146" stroke="#cbd5e1" stroke-width="2.2" />

        <!-- Status Tag -->
        <rect x="25" y="164" width="160" height="14" rx="3" fill="#1c1306" />
        <text x="105" y="174" class="font-mono" font-size="8" font-weight="700" fill="#f59e0b" text-anchor="middle">TARGET: CLASS_ID 0</text>
      </g>

      <!-- Right Telemetry Metrics -->
      <g transform="translate(226, 0)">
        <!-- Metric 1: Class -->
        <g transform="translate(0, 0)">
          <rect width="182" height="54" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">FILTER TARGET</text>
          <text x="14" y="42" class="font-mono" font-size="12" font-weight="700" fill="#f59e0b">PERSON (CLASS 0)</text>
        </g>

        <!-- Metric 2: Latency -->
        <g transform="translate(0, 64)">
          <rect width="182" height="54" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">INFERENCE LATENCY</text>
          <text x="14" y="44" class="font-sans" font-size="20" font-weight="800" fill="#ffffff">14.2 <tspan font-size="11" font-weight="600" fill="#38bdf8">MS</tspan></text>
        </g>

        <!-- Metric 3: Model Weights -->
        <g transform="translate(0, 128)">
          <rect width="182" height="58" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">WEIGHTS BACKBONE</text>
          <text x="14" y="42" class="font-mono" font-size="12" font-weight="700" fill="#10b981">YOLOV8 NANO (3.2M)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
